name: IRIS Studio Baseline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iris-studio-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    name: repository-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install locked dependencies
        run: npm ci

      - name: Check repository baseline
        run: npm run check:baseline

      - name: Run GEF diagnostics
        run: |
          npm run gef:doctor
          npm run gef:status

      - name: Audit dependencies
        run: npm audit --audit-level=high
